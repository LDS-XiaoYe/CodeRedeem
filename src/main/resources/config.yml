# 是否启用MySQL数据库存储（true=MySQL, false=YAML配置文件）
enable-mysql: false

# MySQL数据库配置（仅在enable-mysql为true时生效）
mysql:
  host: localhost
  port: 3306
  database: coderedeem
  username: root
  password: ''
  useSSL: false

